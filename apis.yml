aid: force-therapeutics
name: Force Therapeutics
description: >-
  Force Therapeutics is a healthcare technology company providing a digital patient-engagement and
  remote-monitoring platform for surgical and musculoskeletal care. The platform delivers personalized
  patient education, automated collection of Patient-Reported Outcome Measures (PROMs), preoperative
  optimization, postoperative recovery management, direct patient messaging, and actionable clinical
  insights for hospitals, ambulatory surgery centers, and private practices. Force integrates with major
  EHR systems (Epic, Cerner, MEDITECH, NextGen) through the Redox Connection Network and FHIR/HL7-based
  workflows rather than a public developer API. The platform is SOC 2 Type II and HIPAA compliant, hosted
  on Amazon Web Services, and backed by Insight Partners.
